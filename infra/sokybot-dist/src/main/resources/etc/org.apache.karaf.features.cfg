#
# Custom features configuration for Sokybot distribution.
#

featuresRepositories = \
    mvn:org.apache.karaf.features/standard/4.4.6/xml/features, \
    mvn:org.apache.karaf.features/framework/4.4.6/xml/features, \
    mvn:org.sokybot/sokybot-features/1.0-SNAPSHOT/xml/features

featuresBoot = \
    (wrap), \
    standard/4.4.6, \
    sokybot-jackson/2.15.2, \
    framework/4.4.6, \
    scr/4.4.6, \
    eventadmin/4.4.6, \
    log/4.4.6, \
    http/8.0.27, \
    sokybot-full/1.0.0.SNAPSHOT

# Disable strict enforcement of osgi.service requirements in the resolver.
# This avoids hard failures when bundles declare service requirements
# that are satisfied at runtime by the Karaf logging infrastructure,
# but are not modelled with osgi.service capabilities in features metadata.
serviceRequirements = disable

featuresBootAsynchronous = false
autoRefresh = true

