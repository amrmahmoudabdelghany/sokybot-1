# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Maven dependencies
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "maven"
    commit-message:
      prefix: "deps(maven)"
    # Group minor and patch updates together
    groups:
      maven-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Ignore specific dependencies (major version changes handled manually)
    ignore:
      # Stay on SLF4J 1.x
      - dependency-name: "org.slf4j:*"
        update-types: ["version-update:semver-major"]
      # Stay on Logback 1.4.x
      - dependency-name: "ch.qos.logback:*"
        update-types: ["version-update:semver-major"]
      # Stay on Hibernate 5.x (6.x requires Java 17)
      - dependency-name: "org.hibernate:*"
        update-types: ["version-update:semver-major"]
      # Stay on Spring 5.x (6.x requires Java 17)
      - dependency-name: "org.springframework:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springframework.data:*"
        update-types: ["version-update:semver-major"]
      # Stay on Karaf 4.4.x
      - dependency-name: "org.apache.karaf*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps(actions)"

  # npm dependencies (for frontend modules)
  - package-ecosystem: "npm"
    directory: "/ui/sokybot-webview/src/main/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "deps(npm)"
    groups:
      npm-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Ignore major version updates for stability
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
