name: CI

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]
  schedule:
    # Run security scan weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.10.0'
          cache: 'npm'
          cache-dependency-path: 'ui/**/package-lock.json'

      - name: Build, test, and generate reports
        env:
          VITE_UI_BUILD_ID: ${{ github.sha }}
        run: >
          ./mvnw -fae -P ci verify
          surefire-report:report-only
          jacoco:report
          spotbugs:spotbugs
          checkstyle:checkstyle
          pmd:pmd

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/target/surefire-reports
            **/target/failsafe-reports
            **/target/site/jacoco
            **/target/spotbugsXml.xml
            **/target/checkstyle-result.xml
            **/target/pmd.xml
          retention-days: 30
          if-no-files-found: warn

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            target/bom.json
            target/bom.xml
          retention-days: 90
          if-no-files-found: warn

      - name: Upload coverage to Codecov
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@v4
        with:
          files: ./**/target/site/jacoco/jacoco.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  security:
    runs-on: ubuntu-latest
    # Run security check only on main/master branches and weekly
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-owasp-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-owasp-

      - name: Run OWASP Dependency Check
        run: ./mvnw -fae dependency-check:aggregate -P security

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check
          path: |
            target/dependency-check-report.*
          retention-days: 30
          if-no-files-found: warn

      - name: Analyze dependencies
        run: ./mvnw -fae dependency:analyze -DignoreNonCompile=true
        continue-on-error: true
