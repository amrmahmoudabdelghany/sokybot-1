name: CI

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]
  schedule:
    # Run security scan weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-
      
      - name: Build with Maven
        run: ./mvnw clean install -P ci
      
      - name: Generate test reports
        if: always()
        run: ./mvnw surefire-report:report
      
      - name: Generate JaCoCo coverage report
        if: always()
        run: ./mvnw jacoco:report
      
      - name: Generate SpotBugs report
        if: always()
        run: ./mvnw spotbugs:spotbugs
      
      - name: Generate Checkstyle report
        if: always()
        run: ./mvnw checkstyle:checkstyle
      
      - name: Generate PMD report
        if: always()
        run: ./mvnw pmd:pmd
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/target/surefire-reports
            **/target/site/jacoco
            **/target/spotbugsXml.xml
            **/target/checkstyle-result.xml
            **/target/pmd.xml
          retention-days: 30
      
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./**/target/site/jacoco/jacoco.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  security:
    runs-on: ubuntu-latest
    # Run security check only on main/master branches and weekly
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'schedule'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-
      
      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-owasp-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-owasp-
      
      - name: Run OWASP Dependency Check
        run: ./mvnw dependency-check:aggregate -P security
        continue-on-error: true
      
      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check
          path: |
            target/dependency-check-report.*
          retention-days: 30
      
      - name: Analyze dependencies
        run: ./mvnw dependency:analyze -DignoreNonCompile=true
        continue-on-error: true
