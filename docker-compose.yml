services:
  sokybot-backend:
    build: .
    container_name: sokybot-backend
    restart: unless-stopped
    networks:
      - default
      - proxy_net
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
      # UID 1000 does not use /root; soky passes -Dmaven.repo.local=/var/maven/.m2/repository when present
      - ~/.m2:/var/maven/.m2
      - "../Cyper Online Official Client:/app/game-client"
    ports:
      - "8182:8182"
      - "5005:5005"
      - "8101:8101"
    environment:
      - SOKY_DEV_MODE=true
      - SOKY_WEBVIEW_URL=http://sokybot.local
      - KARAF_DEBUG=true
      - SOKYBOT_DB_PATH=/app/data/db
      # In-container inotify on bind mounts is unreliable; host: `soky backend watch-host`. Set to 1 to enable `backend start --watch` inside Docker.
      - SOKY_JAR_WATCH_IN_CONTAINER=${SOKY_JAR_WATCH_IN_CONTAINER:-}
    command: ./infra/scripts/soky backend start --foreground

  sokybot-webview-ui:
    image: node:20-alpine
    container_name: sokybot-webview-ui
    restart: unless-stopped
    working_dir: /app/ui
    networks:
      - default
      - proxy_net
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=ws://api.sokybot.local/rsocket
    command: npm run dev -w frontend

networks:
  default:
  proxy_net:
    external: true
